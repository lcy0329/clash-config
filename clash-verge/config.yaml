# ── 代理组（完整替换订阅自带代理组）────────────────────────────────────────
# include-all-providers: true  → 从 proxy-providers 拉取节点（原始订阅）
# include-all-proxies: true    → 从 proxies 列表拉取节点（subconverter 转换后的订阅）
# 两者同时写，兼容两种订阅形式

proxy-groups:

  # 顶层手动选择
  - name: 🚀 节点选择
    type: select
    include-all-providers: true
    include-all-proxies: true
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇺🇸 美国自动
      - 🇸🇬 新加坡自动
      - DIRECT

  # 全局自动测速
  - name: ♻️ 自动选择
    type: url-test
    include-all-providers: true
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ── 地区节点（url-test 自动选最快）──

  - name: 🇭🇰 香港自动
    type: url-test
    include-all-providers: true
    include-all-proxies: true
    filter: '(?i)(香港|Hong[ ._-]?Kong|🇭🇰|(^|[^a-z])HK([^a-z]|$))'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇯🇵 日本自动
    type: url-test
    include-all-providers: true
    include-all-proxies: true
    filter: '(?i)(日本|Japan|Tokyo|Osaka|🇯🇵|(^|[^a-z])JP([^a-z]|$))'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇺🇸 美国自动
    type: url-test
    include-all-providers: true
    include-all-proxies: true
    filter: '(?i)(美国|United[ ._-]?States|Los[ ._-]?Angeles|San[ ._-]?Jose|Seattle|New[ ._-]?York|🇺🇸|(^|[^a-z])US([^a-z]|$))'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 🇸🇬 新加坡自动
    type: url-test
    include-all-providers: true
    include-all-proxies: true
    filter: '(?i)(新加坡|Singapore|狮城|🇸🇬|(^|[^a-z])SG([^a-z]|$))'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ── 功能专用组 ──

  # AI：手动选择固定节点；REJECT 用于未选择/无匹配节点时阻止请求
  # 首次使用需手动选节点；REJECT 也保留在 filter 中，兼容对显式项过滤的客户端
  - name: 🤖 AI服务
    type: select
    include-all-providers: true
    include-all-proxies: true
    filter: '(?i)(美国|United[ ._-]?States|Los[ ._-]?Angeles|San[ ._-]?Jose|Seattle|New[ ._-]?York|日本|Japan|Tokyo|Osaka|新加坡|Singapore|狮城|台湾|Taiwan|🇺🇸|🇯🇵|🇸🇬|🇹🇼|(^|[^a-z])(US|JP|SG|TW)([^a-z]|$)|^REJECT$)'
    proxies:
      - REJECT
    empty-fallback: REJECT

  # GitHub：优先日本低延迟，备选美国
  - name: 🐙 GitHub
    type: select
    proxies:
      - 🇯🇵 日本自动
      - 🇺🇸 美国自动
      - 🚀 节点选择

  # YouTube：日本/港/新优先（CDN 距离近，画质更稳）
  - name: 📹 YouTube
    type: select
    proxies:
      - 🇯🇵 日本自动
      - 🇭🇰 香港自动
      - 🇸🇬 新加坡自动
      - 🚀 节点选择

  # 流媒体（Netflix 等需要解锁节点时在此切换）
  - name: 🎬 流媒体
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇸🇬 新加坡自动
      - 🇺🇸 美国自动

  - name: 📲 Telegram
    type: select
    proxies:
      - 🚀 节点选择
      - 🇸🇬 新加坡自动
      - 🇭🇰 香港自动

  # 微软/苹果：默认直连，需要时可切代理
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  # 功能组
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

# ── 规则（完整替换，按优先级从高到低）──────────────────────────────────────

